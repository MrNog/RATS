<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#141517" />
  <link rel="preconnect" href="https://rats-tools-default-rtdb.europe-west1.firebasedatabase.app" crossorigin />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E🧀%3C/text%3E%3C/svg%3E" />
  <title>RATS — Guild Roster</title>

  <!-- shared -->
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/ui.css">
  <!-- page-specific -->
  <link rel="stylesheet" href="guild.css">
</head>

<body>
  <div class="wrap wide">
    <div class="head">
      <a class="btn" href="../index.html">← Back to Tools</a>
      <h1><svg class="hicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg> RATS — Guild Roster</h1>
      <button id="importBtn" onclick="openModal()">📥 Import roster</button>
    </div>
    <p class="sub" id="metaLine">Import your guild roster JSON (from the in-game export) to build the database.</p>

    <div class="stats" id="stats"></div>

    <div class="controls">
      <input type="text" id="search" placeholder="Search name / spec / profession…" oninput="paint()" />
      <select id="rankSel" onchange="paint()">
        <option value="">All ranks</option>
      </select>
      <button type="button" class="tbtn active" onclick="toggleChk('hideAlts', this)">hide alts</button>
      <input type="checkbox" id="hideAlts" checked hidden>
      <button type="button" class="tbtn" onclick="toggleChk('fangsOnly', this)">💀 fangs only</button>
      <input type="checkbox" id="fangsOnly" hidden>
    </div>

    <div class="err" id="err"></div>
    <div id="roster"></div>
  </div>

  <!-- import modal -->
  <div id="modal" onclick="if(event.target===this) closeModal()">
    <div class="box">
      <div class="mhead">
        <h2>📥 Paste guild roster JSON</h2>
        <button class="alt" onclick="closeModal()">✕</button>
      </div>
      <p class="sub">Run the in-game roster export, copy its JSON, and paste it below. It <b>merges</b> with the current
        data — <b>💀 Fangs</b>, specs and join dates are kept.</p>
      <textarea id="jsonIn" placeholder="Paste the guild roster JSON here…"></textarea>
      <div class="err" id="modalErr"></div>
      <div class="controls">
        <button onclick="importRoster()">🔍 Compare changes</button>
        <button id="confirmBtn" onclick="confirmImport()" style="display:none">✅ Confirm &amp; merge</button>
        <button class="alt" onclick="closeModal()">Cancel</button>
      </div>
      <div id="diff"></div>
    </div>
  </div>

  <script src="../../assets/js/data.js"></script>
  <script src="guild.js"></script>
</body>

</html>
