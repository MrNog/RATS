<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#141517" />
  <link rel="preconnect" href="https://rats-tools-default-rtdb.europe-west1.firebasedatabase.app" crossorigin />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E🧀%3C/text%3E%3C/svg%3E" />
  <title>RATS — Vacations</title>

  <!-- shared -->
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/ui.css">
  <!-- page-specific -->
  <link rel="stylesheet" href="vacations.css">
</head>

<body>
  <div class="wrap">
    <div class="row">
      <a class="btn" id="backLink" href="../../index.html">← Back</a>
      <h1><svg class="hicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2" />
          <path d="M12 20v2" />
          <path d="m4.93 4.93 1.41 1.41" />
          <path d="m17.66 17.66 1.41 1.41" />
          <path d="M2 12h2" />
          <path d="M20 12h2" />
          <path d="m6.34 17.66-1.41 1.41" />
          <path d="m19.07 4.93-1.41 1.41" />
        </svg> RATS — Vacations</h1>
      <a class="btn" id="attLink" href="../../officer/history/index.html" style="display:none;margin-left:auto">📊
        Attendance →</a>
    </div>
    <p class="sub">Going away? Mark your dates so you're <b>not counted as a miss</b> on raid attendance. Pick your
      character, set the dates — single day? Fill <b>From</b> only.</p>

    <div class="card">
      <div class="form">
        <div style="position:relative;min-width:190px">
          <input type="text" id="vSearch" placeholder="Type your character…" autocomplete="off" oninput="acFilter()"
            onfocus="acFilter()" style="width:100%">
          <div id="vList" class="ac" style="display:none"></div>
        </div>
        <div class="segs" id="typeSegs"
          title="Vacation = playful away card. Personal = soft, low-key note (no dates/countdown)">
          <button type="button" class="seg active" data-t="vacation" onclick="setType(this)">🏖️ Vacation</button>
          <button type="button" class="seg" data-t="personal" onclick="setType(this)">💤 Personal</button>
        </div>
        <input type="date" id="vStart" lang="en-GB" title="From">
        <input type="date" id="vEnd" lang="en-GB" title="To (optional)">
        <input type="text" id="vNote" placeholder="note for officers (optional)" maxlength="120">
        <button onclick="addVac()">+ Add</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <div id="previewWrap" class="card preview" style="display:none">
      <div class="pv-hd">
        <span class="pv-title"><span class="pv-eye">👁</span> Live preview</span>
        <span class="pv-sub">this is exactly what posts to Discord</span>
      </div>
      <div id="devCard"></div>
    </div>

    <!-- ONE vacations list: currently-away first (with bars), then upcoming, then ended.
         Officers get repost/edit/remove inline; guildies see it read-only.
         Sort toggle: "By status" (away-now first) or "By raider" (each person's vacations grouped). -->
    <div class="listhd">
      <h2 class="sec" onclick="toggleSec('all')"><span class="caret" id="caretall">▼</span> 📅 Vacations <span
          class="cnt" id="cntall"></span></h2>
      <div class="segs sortsegs" id="sortSegs" title="Order the list by status, or grouped per raider">
        <button type="button" class="seg active" data-sort="status" onclick="setSort(this)">By status</button>
        <button type="button" class="seg" data-sort="raider" onclick="setSort(this)">By raider</button>
      </div>
    </div>
    <div id="allWrap" class="seclist">
      <div id="all"></div>
    </div>

    <!-- officers only: month calendar + click-a-day detail (revealed by vacations.js with the guild key) -->
    <div id="calSection" class="officer-only" style="display:none">
      <div class="calnav">
        <h2 style="margin:0">🗓️ Calendar</h2>
        <button class="del" onclick="calShift(-1)" title="Previous month" style="border-color:#3a3d44;color:#9aa0a6">◀</button>
        <b id="calLabel" style="color:#fff;min-width:160px;text-align:center"></b>
        <button class="del" onclick="calShift(1)" title="Next month" style="border-color:#3a3d44;color:#9aa0a6">▶</button>
        <button class="del" onclick="calToday()" style="border-color:#3a3d44;color:#9aa0a6">Today</button>
      </div>
      <div class="calwrap">
        <div id="calBox"></div>
        <aside id="calToday" class="caltoday"></aside>
      </div>
    </div>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/data.js"></script>
  <script src="../../assets/js/datepicker.js"></script>
  <script src="vacations.js"></script>
</body>

</html>
