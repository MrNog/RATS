<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#141517" />
  <link rel="preconnect" href="https://rats-tools-default-rtdb.europe-west1.firebasedatabase.app" crossorigin />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E🧀%3C/text%3E%3C/svg%3E" />
  <title>RATS — Raider Profile</title>

  <!-- shared -->
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/ui.css">
  <!-- page-specific -->
  <link rel="stylesheet" href="../../assets/css/site.css">
  <link rel="stylesheet" href="profile.css">
</head>

<body>
  <header class="site-bar" data-root="../.." data-page="profile"></header>
  <!-- the raider's banner behind the header, filled by profile.js (hidden on the welcome screen) -->
  <div class="band raider" id="pband" aria-hidden="true" hidden><img id="pbandImg" alt=""></div>

  <div class="wrap wide">
    <!-- the tools; profile.js moves them into the raider's header, and back here for the welcome -->
    <div class="ptools">
      <span class="pt-acts">
        <!-- jump to the guild rankings / hall of fame -->
        <a class="btn" href="../rankings/index.html" title="Guild rankings &amp; hall of fame"
          style="display:inline-flex;gap:6px;align-items:center">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
            <path d="M4 22h16" />
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
          </svg> Rankings</a>
        <!-- jump to any raider's profile (free for all) -->
        <div class="psearch" id="psearch" style="display:none">
          <svg class="ps-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input type="text" id="pSearchInput" placeholder="Jump to raider…" autocomplete="off" spellcheck="false"
            aria-label="Jump to a raider's profile" oninput="psFilter()" onfocus="psFilter()" />
          <div id="pSearchList" class="ac" style="display:none"></div>
        </div>
      </span>
    </div>

    <div id="profile" style="display:none"></div>
  </div>

  <!-- art lightbox: same controls as the gallery page (Esc, arrows, click the backdrop) -->
  <dialog id="artlb">
    <div class="lb-count" id="artlbCount"></div>
    <button class="lb-x" onclick="closeArt()" title="Close (Esc)" aria-label="Close">✕</button>
    <button class="lb-nav prev" onclick="stepArt(-1)" title="Previous (←)" aria-label="Previous image">‹</button>
    <button class="lb-nav next" onclick="stepArt(1)" title="Next (→)" aria-label="Next image">›</button>
    <div class="lb-stage" id="artlbStage">
      <img id="artlbImg" alt="" />
      <div class="lb-bar">
        <div class="lb-txt">
          <div class="t" id="artlbTitle"></div>
          <div class="c" id="artlbCap"></div>
        </div>
        <a class="lb-dl" id="artlbDl" download>⬇ Download</a>
      </div>
    </div>
  </dialog>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/data.js"></script>
  <script src="../../assets/js/logs-core.js"></script>
  <script src="../../assets/js/fun-awards.js"></script>
  <script src="../../assets/js/banner-art.js"></script>
  <script src="profile.js"></script>
  <script src="../../assets/js/nav.js"></script>
</body>

</html>
