      <a class="btn" href="../../index.html">← Back</a>
      <h1><svg class="hicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg> RATS — Raider Profile</h1>
      <span style="margin-left:auto;display:inline-flex;gap:8px;align-items:center">
        <!-- jump to the guild rankings / hall of fame -->
        <a class="btn" href="../rankings/index.html" title="Guild rankings &amp; hall of fame"
          style="display:inline-flex;gap:6px;align-items:center">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />

          </svg>
          <input type="text" id="pSearchInput" placeholder="Jump to raider…" autocomplete="off" spellcheck="false"
